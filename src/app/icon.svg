<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo -->
  <rect width="512" height="512" rx="112" fill="#0f766e"/>
  <!-- Dona: el presupuesto compartido repartido entre los dos (~2/3 y ~1/3) -->
  <g transform="rotate(-90 256 256)" fill="none" stroke-width="56">
    <circle cx="256" cy="256" r="150" stroke="#ccfbf1" opacity="0.35"/>
    <circle cx="256" cy="256" r="150" stroke="#ffffff" stroke-dasharray="560 943" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="150" stroke="#5eead4" stroke-dasharray="222 943" stroke-dashoffset="-640" stroke-linecap="round"/>
  </g>
  <!-- Signo de pesos -->
  <text x="256" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="700" fill="#ffffff">$</text>
</svg>
